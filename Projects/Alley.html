<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>The Alley</title>
  <link href="../style.css" rel="stylesheet" type="text/css">
</head>

<body style="background-color: rgba(177, 237, 57, 0.35);">

  <!-- Header -->
  <div id="header"></div>
  <script>
    // 动态加载公共导航栏
    fetch('../header.html')
      .then(res => res.text())
      .then(html => document.getElementById('header').innerHTML = html)
      .catch(err => console.error('Header load failed:', err));
  </script>


  <div id="navbar"></div>

  <script>
    // 动态加载公共导航栏
    fetch('../nav.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar').innerHTML = html)
      .catch(err => console.error('Navigation load failed:', err));
  </script>
    <div class=" margin-all">

      <section id="project-info"></section>

      <script>
        const container = document.getElementById("project-info");

        fetch("/complete-projects.json")
          .then(res => res.json())
          .then(data => {
            let project = null;

            // 🔍 在所有分类中遍历查找
            for (const category in data) {
              project = data[category].find(p => p.title === "The Alley");
              if (project) break;
            }

            if (!project) {
              container.innerHTML = "<p>Project not found.</p>";
              return;
            }

            // 动态标题
            const h2 = document.createElement("h2");
            h2.textContent = project.title;
            container.appendChild(h2);

            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));

            // 动态描述（如果 JSON 里有）
            if (project.description) {
              const p = document.createElement("p");
              p.className = "p";
              p.textContent = project.description;
              container.appendChild(p);
              container.appendChild(document.createElement("br"));
            }

            const fields = [

              { key: "role" },
              { key: "date" },
              { key: "tools" }

            ];

            fields.forEach(({ key }) => {
              if (project[key]) {
                container.appendChild(document.createElement("br"));
                const p = document.createElement("p");
                p.className = "p";
                p.innerHTML = ` ${project[key]}`;
                container.appendChild(p);
              }
            });
            container.appendChild(document.createElement("br"));




          })
          .catch(err => {
            console.error("Load failed:", err);
            container.innerHTML = "<p>Error loading project.</p>";
          });

      </script>
      <!-- 🌼 4. Project Media Section -->

      <div class="dash-divide">
        <div class="row full">

          <img src="../img/game/unity/unity1.jpg" />
        </div>
      </div>

      <div class="video-container">
        <video class="video-player" autoplay muted loop controls>
          <source src="../vid/Magic.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>

      </div>
      <!-- 🌸 Gallery Part 2 + p5 embed -->
      <div class="dash-divide">
        <div class="row two">
          <img src="../img/game/unity/unity2.jpeg" />
          <img src="../img/game/unity/unity8.jpeg" />
        </div>
      </div>

        <h3 class="p">Previous Versions</h3> -->

  </div>

  <!-- 🧭 7. Back Navigation -->

</body>
