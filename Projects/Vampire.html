<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Fangs: The Eternal Coven</title>
  <link href="../style.css" rel="stylesheet" type="text/css">
</head>

<body style="background-color: rgba(177, 237, 57, 0.35);">

  <div id="navbar"></div>
  <script>
    // 动态加载公共导航栏
    fetch('../nav.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar').innerHTML = html)
      .catch(err => console.error('Navigation load failed:', err));
  </script>

  <div class="scroll-container">
    <!-- Header -->
    <section id="header">
      <script>
        // 动态加载公共导航栏
        fetch('../header.html')
          .then(res => res.text())
          .then(html => document.getElementById('header').innerHTML = html)
          .catch(err => console.error('Header load failed:', err));
      </script>
    </section>
    <!-- 🌸 3. Project Header -->
    <div class=" margin-all ">

      <section id="project-info"></section>

      <script>
        const container = document.getElementById("project-info");

        fetch("/complete-projects.json")
          .then(res => res.json())
          .then(data => {
            let project = null;

            // 🔍 在所有分类中遍历查找
            for (const category in data) {
              project = data[category].find(p => p.title === "Fangs: The Eternal Coven");
              if (project) break;
            }

            if (!project) {
              container.innerHTML = "<p>Project not found.</p>";
              return;
            }

            // 动态标题
            const h2 = document.createElement("h2");
            h2.textContent = project.title;
            container.appendChild(h2);

            container.appendChild(document.createElement("br"));

            // 动态描述（如果 JSON 里有）
            if (project.description) {

              container.appendChild(document.createElement("br"));
              const p = document.createElement("p");
              p.className = "p";
              p.textContent = project.description;
              container.appendChild(p);
              container.appendChild(document.createElement("br"));
            }

            const fields = [

              { key: "role" },
              { key: "date" },
              { key: "tools" }

            ];

            fields.forEach(({ key }) => {
              if (project[key]) {
                container.appendChild(document.createElement("br"));
                const p = document.createElement("p");
                p.className = "p";
                p.innerHTML = ` ${project[key]}`;
                container.appendChild(p);
              }
            });
            container.appendChild(document.createElement("br"));




          })
          .catch(err => {
            console.error("Load failed:", err);
            container.innerHTML = "<p>Error loading project.</p>";
          });

      </script>
      <!-- 🌼 4. Project Media Section -->

      <!-- 🌺 Gallery Part 1 -->
      <section class="dash-divide">
        <div class="row two">
          <img src="../img/game/vampire/IMG_8377.jpg" alt="project image 2" />
          <img src="../img/game/vampire/Fangs_Rulebook.png" alt="project image 1" />

        </div>
      </section>

      <section class="dash-divide">
        <div class="row full">
          <embed src="../img/game/vampire/Fangs_Rulebook.pdf" alt="project image 3" width="100%" height="auto"
            style="aspect-ratio: 16/9;" />

        </div>
      </section>

      <!-- ✏️ 6. Process & Concept -->
      <section class="p5-content">
        <h3 class="p">Process & Concept</h3>
        <p class="p">

        </p>
      </section>




      <!-- 🌼 Older versions embeds -->
      <section class="p5-content">
        <h3 class="p">Previous Versions</h3>

    </div>
    <!-- 🧭 7. Back Navigation -->
    <div id="back">
      <div class="category_btn" onclick="history.back()">
        <h4 class="block-display">Go Back</h4>
      </div>
    </div>
  </div>
</body>
<html>
